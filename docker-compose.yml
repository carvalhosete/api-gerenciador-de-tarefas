version: '3.8'

services: 
  postgres: # nome dado para o nosso serviço/contêiner de banco de dados
    image: postgres:14-alpine # A imagem usada: PostgreSQL versão 14, otimizada (alpine)
    container_name: postgres_db_tarefas # Nome específico para o contêiner
    restart: always # Sempre reiniciar o contêiner se ele parar por algum motivo
    ports:
      - "5432:5432" # Mapeia a porta 5432 do PC para a porta 5432 do contêiner
    environment: # Define as variáveis de ambiente (configurações) dentro do contêiner
      - POSTGRES_USER=docker
      - POSTGRES_PASSWORD=docker
      - POSTGRES_DB=tarefas_api
    volumes:
      - ./postgres-data:/var/lib/postgresql/data # Garante que os dados do banco não se percam se o contêiner for recriado
